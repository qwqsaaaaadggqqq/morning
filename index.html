<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Утро</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg: #f4f3ee; --card: #ffffff; --line: rgba(31,30,29,.12); --line-strong: rgba(31,30,29,.22);
  --text: #1f1e1d; --text-2: #5f5e5a; --text-3: #8a8983;
  --accent: #185fa5; --accent-bg: #e6f1fb;
  --warn: #854f0b; --warn-bg: #faeeda;
  --danger: #a32d2d; --danger-bg: #fcebeb;
  --ok: #3b6d11; --ok-bg: #eaf3de;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a19; --card: #242423; --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.2);
    --text: #f1efe8; --text-2: #b4b2a9; --text-3: #888780;
    --accent: #85b7eb; --accent-bg: #0c447c;
    --warn: #fac775; --warn-bg: #633806;
    --danger: #f09595; --danger-bg: #791f1f;
    --ok: #c0dd97; --ok-bg: #27500a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
h1 { font-size: 28px; font-weight: 500; margin: 0; }
.sub { color: var(--text-2); }
.clock { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); grid-template-areas: "sched weather" "sched vpn"; align-items: start; }
.grid > #sched { grid-area: sched; } .grid > #weather { grid-area: weather; } .grid > #vpn { grid-area: vpn; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0,1fr); grid-template-areas: "sched" "weather" "vpn"; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.lbl { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; margin-bottom: 12px; }
.lbl .right { margin-left: auto; color: var(--text-3); }
.big { font-size: 34px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.danger { background: var(--danger-bg); color: var(--danger); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.accent { background: var(--accent-bg); color: var(--accent); }
.lesson { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.lesson:first-of-type { border-top: 0; }
.lesson .time { font-variant-numeric: tabular-nums; }
.lesson .time b { display: block; font-weight: 500; }
.lesson .time span { color: var(--text-3); font-size: 12px; }
.lesson .subj { font-weight: 500; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lesson .meta { color: var(--text-2); font-size: 13px; }
.lesson.past { opacity: .5; }
.lesson.now { background: var(--accent-bg); margin: 0 -12px; padding: 10px 12px; border-radius: 10px; border-top-color: transparent; }
.lesson.now + .lesson { border-top-color: transparent; }
.lesson.cancel .subj span:first-child { text-decoration: line-through; color: var(--text-3); }
.dayhead { margin: 18px 0 4px; font-size: 13px; color: var(--text-2); display: flex; gap: 8px; align-items: center; }
.empty { color: var(--text-2); padding: 8px 0; }
.hours { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; margin-top: 16px; text-align: center; }
.hours div { padding: 8px 2px; border-radius: 10px; }
.hours .h { color: var(--text-3); font-size: 12px; }
.hours i { font-size: 20px; display: block; margin: 2px 0; color: var(--text-2); }
.hours .t { font-weight: 500; font-variant-numeric: tabular-nums; }
.hours .p { font-size: 11px; color: var(--accent); min-height: 16px; }
.hours .past { opacity: .45; }
.hours .cur { background: var(--accent-bg); }
.advice { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; font-size: 14px; }
.row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; color: var(--text); background: transparent; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { background: var(--bg); }
.link { border: 0; padding: 0; color: var(--text-3); text-decoration: underline; font-size: 12px; }
.link:hover { background: none; color: var(--text-2); }
.note { margin-top: 10px; font-size: 13px; color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="greet">Доброе утро</h1>
      <div class="sub" id="today"></div>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="grid">
    <section class="card" id="sched">
      <div class="lbl"><i class="ti ti-calendar"></i>Расписание<span class="right" id="sched-group"></span></div>
      <div id="sched-body"></div>
    </section>

    <section class="card" id="weather">
      <div class="lbl"><i class="ti ti-cloud"></i>Погода<span class="right" id="w-city"></span></div>
      <div id="w-body" class="muted">Загружаю прогноз…</div>
    </section>

    <section class="card" id="vpn">
      <div class="lbl"><i class="ti ti-shield-lock"></i>VPN<span class="right" id="vpn-price"></span></div>
      <div id="vpn-body"></div>
    </section>
  </div>
</div>

<script src="schedule.js"></script>
<script>
const CONFIG = {
  city: { name: "Санкт-Петербург", lat: 59.94, lon: 30.31 },
  subgroup: 1, // 0 — показывать обе подгруппы, 1 или 2 — только свою
  // Время пар с сайта не приходит. Конец пары считаем как начало + 1,5 часа.
  bells: { 1: ["09:00", "10:30"], 2: ["10:45", "12:15"], 3: ["12:50", "14:20"], 4: ["14:30", "16:00"], 5: ["16:10", "17:40"] },
  vpn: { day: 20, price: 500 },
};

const CAMPUS = { "Э": "Энгельса", "П": "Приморский", "О": "онлайн" };
const DOW = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const humanDate = (d) => `${d.getDate()} ${MON[d.getMonth()]}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const atTime = (day, hhmm) => { const [h, m] = hhmm.split(":").map(Number); const d = new Date(day); d.setHours(h, m, 0, 0); return d; };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };

function renderHeader(now) {
  const h = now.getHours();
  $("greet").textContent = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
  $("today").textContent = `${DOW[now.getDay()]}, ${humanDate(now)}`;
  $("clock").textContent = `${pad(h)}:${pad(now.getMinutes())}`;
}

/* ---------- Расписание ---------- */

function lessonsOn(day) {
  const key = iso(day);
  const list = (window.SCHEDULE?.lessons || []).filter((l) => l.date === key && (!CONFIG.subgroup || !l.sub || l.sub === CONFIG.subgroup));
  const byN = new Map();
  for (const l of list) { if (!byN.has(l.n)) byN.set(l.n, []); byN.get(l.n).push(l); }
  return [...byN.entries()].sort((a, b) => a[0] - b[0]).map(([n, items]) => ({ n, items }));
}

function slotTimes(day, n) {
  const b = CONFIG.bells[n];
  return b ? [atTime(day, b[0]), atTime(day, b[1])] : null;
}

function lessonHtml(day, slot, now) {
  const t = slotTimes(day, slot.n);
  const first = slot.items[0];
  const cancelled = slot.items.every((l) => /отмен/i.test(l.subject));
  let cls = "lesson", badge = "";
  if (cancelled) { cls += " cancel"; badge = '<span class="pill danger">отменена</span>'; }
  else if (t && now >= t[0] && now < t[1]) { cls += " now"; badge = `<span class="pill accent">идёт, ещё ${Math.ceil((t[1] - now) / 60000)} мин</span>`; }
  else if (t && now >= t[1]) cls += " past";
  else if (t && t[0] - now < 3 * 3600e3 && t[0] > now) { const m = Math.round((t[0] - now) / 60000); badge = `<span class="pill accent">через ${m >= 60 ? Math.floor(m / 60) + " ч " : ""}${m % 60} мин</span>`; }
  if (!cancelled && slot.items.some((l) => l.zam === 1 || l.zam === 3)) badge += ' <span class="pill warn">замена</span>';

  const same = slot.items.length === 1 || slot.items.every((l) => l.subject === first.subject);
  const subject = same ? first.subject : slot.items.map((l) => l.subject).join(" / ");
  const meta = slot.items.map((l) => {
    if (/отмен/i.test(l.subject)) return "";
    const where = [l.aud, CAMPUS[l.campus]].filter(Boolean).join(", ");
    return [l.sub ? `подгр. ${l.sub}` : "", where, l.teacher, l.note].filter(Boolean).map(esc).join(" · ");
  }).filter(Boolean).join("<br>");

  return `<div class="${cls}">
    <div class="time"><b>${t ? CONFIG.bells[slot.n][0] : "—"}</b><span>${slot.n} пара</span></div>
    <div><div class="subj"><span>${esc(subject)}</span>${badge}</div>${meta ? `<div class="meta">${meta}</div>` : ""}</div>
  </div>`;
}

function renderSchedule(now) {
  const body = $("sched-body");
  if (!window.SCHEDULE) {
    body.innerHTML = '<div class="empty">Расписания пока нет. Запусти <b>morning.py</b>, он скачает его с сайта.</div>';
    return;
  }
  $("sched-group").textContent = window.SCHEDULE.group;

  const today = lessonsOn(now);
  const active = today.filter((s) => !s.items.every((l) => /отмен/i.test(l.subject)));
  const lastEnd = active.length ? slotTimes(now, active[active.length - 1].n)?.[1] : null;
  const dayOver = !active.length || (lastEnd && now >= lastEnd);

  let html = "";
  if (today.length) {
    const head = dayOver && active.length ? "Сегодня, пары закончились" : `Сегодня, ${active.length} ${plural(active.length, "пара", "пары", "пар")}`;
    html += `<div class="dayhead" style="margin-top:0">${head}</div>` + today.map((s) => lessonHtml(now, s, now)).join("");
  } else {
    html += '<div class="dayhead" style="margin-top:0">Сегодня</div><div class="empty">Пар нет, отдыхай.</div>';
  }

  if (dayOver) {
    for (let i = 1; i <= 7; i++) {
      const d = new Date(now); d.setDate(d.getDate() + i); d.setHours(0, 0, 0, 0);
      const next = lessonsOn(d);
      if (!next.length) continue;
      const name = i === 1 ? "Завтра" : DOW[d.getDay()][0].toUpperCase() + DOW[d.getDay()].slice(1);
      html += `<div class="dayhead">${name}, ${humanDate(d)}</div>` + next.map((s) => lessonHtml(d, s, now)).join("");
      break;
    }
  }

  const upd = new Date(window.SCHEDULE.updated);
  if (iso(upd) !== iso(now)) html += `<div class="note">Расписание обновлялось ${humanDate(upd)}. Запусти morning.py, чтобы подтянуть замены.</div>`;
  else html += `<div class="muted" style="margin-top:12px">Обновлено в ${pad(upd.getHours())}:${pad(upd.getMinutes())}</div>`;
  body.innerHTML = html;
}

/* ---------- Погода ---------- */

const WMO = (c) =>
  c === 0 ? ["Ясно", "ti-sun"] :
  c <= 2 ? ["Переменная облачность", "ti-cloud"] :
  c === 3 ? ["Пасмурно", "ti-cloud"] :
  c <= 48 ? ["Туман", "ti-mist"] :
  c <= 57 ? ["Морось", "ti-cloud-rain"] :
  c <= 67 ? ["Дождь", "ti-cloud-rain"] :
  c <= 77 ? ["Снег", "ti-snowflake"] :
  c <= 82 ? ["Ливень", "ti-cloud-rain"] :
  c <= 86 ? ["Снегопад", "ti-snowflake"] : ["Гроза", "ti-cloud-storm"];

let weather = null;

async function loadWeather() {
  const { lat, lon } = CONFIG.city;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&hourly=temperature_2m,precipitation_probability,weather_code" +
    "&daily=temperature_2m_max,temperature_2m_min,sunset" +
    "&timezone=Europe%2FMoscow&forecast_days=2&wind_speed_unit=ms";
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    weather = await r.json();
    weather.loadedAt = new Date();
  } catch (e) {
    if (!weather) $("w-body").innerHTML = '<div class="empty">Не получилось загрузить прогноз. Проверь интернет, страница попробует ещё раз через 10 минут.</div>';
    setTimeout(loadWeather, 10 * 60e3);
    return;
  }
  renderWeather(new Date());
}

function renderWeather(now) {
  if (!weather) return;
  $("w-city").textContent = CONFIG.city.name;
  const c = weather.current, d = weather.daily, h = weather.hourly;
  const [desc, icon] = WMO(c.weather_code);
  const key = iso(now);
  const hourAt = (hh) => h.time.indexOf(`${key}T${pad(hh)}:00`);

  const cells = [6, 9, 12, 15, 18, 21].map((hh) => {
    const i = hourAt(hh);
    if (i < 0) return "<div></div>";
    const [, ic] = WMO(h.weather_code[i]);
    const p = h.precipitation_probability[i];
    const cls = now.getHours() >= hh + 3 ? "past" : now.getHours() >= hh ? "cur" : "";
    return `<div class="${cls}"><div class="h">${pad(hh)}:00</div><i class="ti ${ic}"></i><div class="t">${Math.round(h.temperature_2m[i])}°</div><div class="p">${p >= 30 ? p + "%" : ""}</div></div>`;
  }).join("");

  // Ближайший час сегодня с заметным шансом осадков.
  let advice = '<i class="ti ti-check"></i>Сегодня без осадков';
  for (let hh = now.getHours(); hh <= 23; hh++) {
    const i = hourAt(hh);
    if (i >= 0 && h.precipitation_probability[i] >= 50) {
      const snow = [71, 73, 75, 77, 85, 86].includes(h.weather_code[i]);
      advice = `<i class="ti ti-umbrella"></i>${snow ? "Снег" : "Дождь"} около ${pad(hh)}:00 (${h.precipitation_probability[i]}%), возьми ${snow ? "шапку" : "зонт"}`;
      break;
    }
  }
  const sunset = new Date(d.sunset[0]);

  $("w-body").className = "";
  $("w-body").innerHTML = `
    <div class="row"><span class="big">${Math.round(c.temperature_2m)}°</span><span>${desc}</span></div>
    <div class="muted" style="margin-top:4px">Ощущается как ${Math.round(c.apparent_temperature)}° · ветер ${Math.round(c.wind_speed_10m)} м/с · днём ${Math.round(d.temperature_2m_min[0])}…${Math.round(d.temperature_2m_max[0])}° · закат в ${pad(sunset.getHours())}:${pad(sunset.getMinutes())}</div>
    <div class="hours">${cells}</div>
    <div class="advice">${advice}</div>`;
}

/* ---------- VPN ---------- */

const PAID_KEY = "vpnPaidFor";
const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const getPaid = () => { try { return localStorage.getItem(PAID_KEY); } catch { return null; } };
const setPaid = (v) => { try { v ? localStorage.setItem(PAID_KEY, v) : localStorage.removeItem(PAID_KEY); } catch {} renderVpn(new Date()); };

function renderVpn(now) {
  $("vpn-price").textContent = `${CONFIG.vpn.price} ₽ каждое ${CONFIG.vpn.day}-е`;
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const paid = getPaid();
  let due = new Date(today.getFullYear(), today.getMonth(), CONFIG.vpn.day);
  const paidThis = paid === monthKey(due);
  if (paidThis) due = new Date(due.getFullYear(), due.getMonth() + 1, CONFIG.vpn.day);

  const days = Math.round((due - today) / 86400e3);
  let big, pill;
  if (days < 0) { big = `Просрочено на ${-days} ${plural(-days, "день", "дня", "дней")}`; pill = '<span class="pill danger"><i class="ti ti-alert-triangle"></i>не оплачено</span>'; }
  else if (days === 0) { big = "Сегодня"; pill = '<span class="pill danger"><i class="ti ti-alert-triangle"></i>день оплаты</span>'; }
  else { big = `${days} ${plural(days, "день", "дня", "дней")}`; pill = paidThis ? '<span class="pill ok"><i class="ti ti-check"></i>этот месяц оплачен</span>' : days <= 5 ? '<span class="pill warn"><i class="ti ti-clock"></i>скоро платить</span>' : ""; }

  $("vpn-body").innerHTML = `
    <div class="big">${big}</div>
    <div class="muted" style="margin:4px 0 12px">${days < 0 ? "срок был" : "до оплаты,"} ${humanDate(due)}</div>
    <div class="row" style="align-items:center">${pill}
      ${paidThis
        ? `<button class="link" id="vpn-undo">отменить отметку</button>`
        : `<button id="vpn-pay">Оплатил</button>`}
    </div>`;
  $("vpn-pay")?.addEventListener("click", () => setPaid(monthKey(new Date(today.getFullYear(), today.getMonth(), CONFIG.vpn.day))));
  $("vpn-undo")?.addEventListener("click", () => setPaid(null));
}

/* ---------- Цикл ---------- */

function tick() {
  const now = new Date();
  renderHeader(now);
  renderSchedule(now);
  renderWeather(now);
  renderVpn(now);
}
tick();
loadWeather();
setInterval(tick, 30e3);
setInterval(loadWeather, 30 * 60e3);
</script>
</body>
</html>
